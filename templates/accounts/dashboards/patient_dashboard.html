{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
/* Professional Patients Dashboard - Ultra Modern Glass Design */
.patients-dashboard {
    min-height: calc(100vh - 200px);
    padding: 2rem;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    position: relative;
}

.patients-dashboard h1 {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 2rem;
    text-align: center;
}

#patients-list {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 2.5rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    min-height: 400px;
    position: relative;
    overflow: hidden;
}

#patients-list::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

/* Empty state styling */
#patients-list:empty::after {
    content: 'No patients data available';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #a0aec0;
    font-size: 1.1rem;
    font-weight: 500;
}

/* Animation */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.patients-dashboard h1,
#patients-list {
    animation: fadeInUp 0.6s ease forwards;
}

.patients-dashboard h1 {
    animation-delay: 0.1s;
}

#patients-list {
    animation-delay: 0.2s;
}

/* Responsive Design */
@media (max-width: 768px) {
    .patients-dashboard {
        padding: 1rem;
    }
    
    .patients-dashboard h1 {
        font-size: 2.2rem;
    }
    
    #patients-list {
        padding: 2rem 1.5rem;
    }
}

@media (max-width: 480px) {
    .patients-dashboard h1 {
        font-size: 1.8rem;
    }
    
    #patients-list {
        padding: 1.5rem 1rem;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="patients-dashboard">
  <h1>Patients Profiles</h1>
  <div id="patients-list"></div>
</div>
{% endblock %}
