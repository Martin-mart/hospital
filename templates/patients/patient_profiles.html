<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Profiles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s infinite linear;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-50px, -50px) rotate(360deg); }
        }

        h2 {
            text-align: center;
            margin-bottom: 3rem;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .profile-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .profile-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.15);
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .profile-header i {
            font-size: 2.5rem;
            color: #667eea;
            margin-right: 1rem;
            transition: transform 0.3s ease;
        }

        .profile-card:hover .profile-header i {
            transform: scale(1.1) rotate(5deg);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
            margin: 0;
        }

        .profile-details {
            font-size: 1rem;
            line-height: 1.7;
            color: #4a5568;
        }

        .profile-details p {
            margin: 0.75rem 0;
            padding: 0.75rem;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.1);
            transition: all 0.3s ease;
        }

        .profile-details p:hover {
            background: rgba(102, 126, 234, 0.08);
            transform: translateX(5px);
        }

        .profile-details strong {
            color: #2d3748;
            font-weight: 600;
        }

        /* Empty state styling */
        .profile-container:has(.profile-card:only-child) p {
            text-align: center;
            color: #a0aec0;
            font-style: italic;
            font-size: 1.1rem;
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-card {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .profile-card:nth-child(1) { animation-delay: 0.1s; }
        .profile-card:nth-child(2) { animation-delay: 0.2s; }
        .profile-card:nth-child(3) { animation-delay: 0.3s; }
        .profile-card:nth-child(4) { animation-delay: 0.4s; }
        .profile-card:nth-child(5) { animation-delay: 0.5s; }
        .profile-card:nth-child(6) { animation-delay: 0.6s; }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            h2 {
                font-size: 2.2rem;
                margin-bottom: 2rem;
            }
            
            .profile-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .profile-card {
                padding: 2rem 1.5rem;
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }
            
            .profile-header i {
                margin-right: 0;
            }
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 1.8rem;
            }
            
            .profile-card {
                padding: 1.5rem 1rem;
            }
            
            .profile-name {
                font-size: 1.3rem;
            }
            
            .profile-details {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <h2>Patient Profiles</h2>
    <div class="profile-container">
        {% for patient in patients %}
            <div class="profile-card">
                <div class="profile-header">
                    <i class="fas fa-user-circle"></i>
                    <span class="profile-name">{{ patient.name }}</span>
                </div>
                <div class="profile-details">
                    <p><strong>Age:</strong> {{ patient.age }}</p>
                    <p><strong>Gender:</strong> {{ patient.gender }}</p>
                    <p><strong>Phone:</strong> {{ patient.phone }}</p>
                    <p><strong>Email:</strong> {{ patient.email }}</p>
                </div>
            </div>
        {% empty %}
            <p>No patient profiles found.</p>
        {% endfor %}
    </div>
</body>
</html>
